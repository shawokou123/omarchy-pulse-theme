# Omarchy Pulse: what your wallpaper shows. Save this file and the wallpaper picks it up in a few seconds.
# Every [[source]] below becomes a panel. Any data you can get from a command, a URL, a file, a stream or a
# camera can live on your desktop; your own scripts go in ~/.config/omarchy-pulse/sources/ (it is on their PATH).
# (c) 2026 Marco Porro (x.com/MarcoPorro), MIT.

[pulse]
city = "Taizhou, Jiangsu"           # weather: "Milan", "Berlin"... (or latitude = 45.46 / longitude = 9.19)
latitude = 32.4907
longitude = 119.9081
units = "metric"                 # or "imperial"
clock = "24h"                    # or "12h"
scene = "image"                  # image (background image) | sphere | skyline | orbit | calm
skyline = "auto"                 # the real city behind the towers: "auto" (the weather's city), "off", or one of
                                 # 90+ cities: rome, milan, alessandria, new-york, tokyo, paris... (docs/GUIDE.md 22)
sphere = "real"                  # the sphere's look: "real" (one continuous image) | "led" (thousands of separate lights)
fps = 20                         # on an empty desktop; it slows down by itself under windows and stops when
                                 # something is full screen
pause_when_covered = true        # pause drawing on monitors almost fully covered by windows
privacy_on_screenshare = true    # sharing or recording the screen hides cameras, notifications and private panels
temp_crit = 90                   # °C: CPU temperature alert
gpu = "auto"                     # "never" if the wallpaper is heavy on a PC without a working GPU driver
dmabuf = "auto"                  # NVIDIA: "auto" keeps WebKit's DMA-BUF renderer off (some drivers draw nothing with
                                 # it); "on" is much lighter on recent drivers, above all with 4K or several monitors
face = "agents"                  # the agent's face in the core: "agents" (while one works) | "always" | "off"
celebrate = true                 # fireworks when an agent finishes, a focus ends or an alert is back to green
sun = true                       # the sky follows the real sun (dawn, day, dusk, night)
# title = "MISSION CONTROL"      # a word under the clock
# font = "CaskaydiaMono Nerd Font"
# port = 47800

[colors]
preset = "matrix"                # theme (the Omarchy theme in use) | synthwave | matrix | amber | ice | vapor | inferno
# accent = "#39e1ff"             # or set any single colour: bg, fg, accent, accent2, ok, warn, crit, dim

[music]
enabled = "auto"                 # the city dances while music plays (needs cava): "auto" | "always" | "off"
input = "pulse"                  # cava's input: "pulse" (PipeWire too) or "pipewire"

[presence]
eyes = true                      # the face's eyes follow your pointer; moving it on an empty desktop wakes the face
lock = true                      # locking the screen (or the screensaver) = you are away: the face sleeps
digest_after = 2                 # minutes away before "while you were away" shows what you missed
notify = true                    # the digest also as a desktop notification
# hypridle can tell Pulse too: on-timeout = omarchy-pulse away / on-resume = omarchy-pulse back

[lan]
enabled = true                   # every device on your network is a car on the grid; a new one is an alert
cars = true
scan = "auto"                    # with fping installed, look for every device every 5 minutes ("off": only those
                                 # your PC already talks to). The first 10 minutes on a network are learnt, no alerts.
alert_new = true
# names = { "192.168.1.5" = "nas", "aa:bb:cc:dd:ee:ff" = "tv" }   # by IP or MAC; else the name your router gives

[voice]
enabled = false                  # Pulse speaks: alerts, agents that finish or need you, the digest, the end of a focus
events = ["alerts", "agents", "digest", "focus", "space"]
quiet = "23:00-08:00"            # never at night ("" = always). Never while sharing the screen, away or in focus.
# model = "~/.local/share/piper/en_US-lessac-medium.onnx"   # piper-tts voice, American English (default: the first
                                 # .onnx in that folder); en_GB-alan-medium for British, it_IT-paola-medium for Italian
# espeak_voice = "en-us"         # espeak-ng: American English by default ("en-gb", "it"...)
# command = "spd-say -e"         # or any command that reads the text on stdin

[git]
root = "auto"                    # your repositories are towers (~/code, ~/src, ~/projects... or a folder of yours)
# repos = ["~/code/omarchytv", "~/code/omarchy-pulse-theme"]   # or exactly these
ci = "auto"                      # the beacon on top: GitHub Actions of the branch (needs `gh auth login`)
max = 8

[space]
enabled = true                   # the ISS when it passes over your city, a real aurora in a geomagnetic storm,
iss = true                       # solar flares (wheretheiss.at, NOAA SWPC)
launches = "spacex"              # rocket launches, Starlink included: countdown, then liftoff on your horizon
                                 # ("all", "rocketlab", "blueorigin", "nasa", "off")

[heart]
# the horizon beats with your heart. Any source that prints your heart rate, for example Home Assistant:
# url = "http://homeassistant.local:8123/api/states/sensor.watch_heart_rate"
# headers = { Authorization = "Bearer YOUR_TOKEN" }
# command = "cat /tmp/heart"     # or a command, or file = "..."
# every = 10

[crew]
# code = ""                      # omarchy-pulse crew new: your friends' agents fly in your city, yours in theirs
# name = "marco"
# share = "agent"                # "agent" (claude, codex...) or "full" (with the project folder)
# relay = "https://ntfy.sh"      # or your own ntfy server

[listen]
# "hey sphere": bind = SUPER, A, exec, omarchy-pulse listen   (whisper.cpp or faster-whisper, offline)
language = "auto"                # or "en", "it"...
# model = "~/.local/share/whisper/ggml-base.bin"
# ask = "claude -p"              # questions it does not know go to this AI (the question only, no recording)

[builtin]
system = true
network = true
weather = true
media = true                     # now playing (playerctl)
notifications = true             # the last desktop notifications (Omarchy 4.5 or mako); private
github = ["basecamp/omarchy"]    # repos to follow: latest release and commits ([] to hide)
github_notifications = true      # your GitHub notifications, when `gh auth login` is done

# ---------------------------------------------------------------- your sources
# Common keys: name (unique), title, slot = left|right|center|ticker|auto, order, every (seconds), timeout,
# type = auto|stat|gauge|list|status|text|kv|chart|image, private = true (hidden while sharing the screen),
# icon (a Nerd Font glyph), notify = true (also a desktop notification on alerts),
# warn_above / crit_above / warn_below / crit_below (numbers: the panel turns amber/red and INCOMING plays).

[[source]]
name = "services"
title = "systemd"
icon = "󰒓"
command = "pulse-systemd"        # failed system and user units (ships with Pulse)
every = 60
type = "status"
slot = "right"

[[source]]
name = "news"
title = "纽约时报 · 中文"
icon = "󰎕"
command = "pulse-feed '纽时=https://cn.nytimes.com/rss/'"
every = 300
slot = "right"
click = "xdg-open https://cn.nytimes.com/"

